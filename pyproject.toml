[project]
name = "alphax_crewflow"
authors = [{ name = "AlphaX", email = "info@alphax.sa" }]
description = "AlphaX CrewFlow - freelancer and crew work-order management for project-based service businesses"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "hijridate>=2.3.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
